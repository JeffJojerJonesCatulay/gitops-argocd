apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: basic-web-ingress
spec:
  rules:
    - host: basic-web.local
      http:
        paths:
          - path: /BasicAppWeb
            pathType: Prefix
            backend:
              service:
                name: basic-web-service
                port:
                  number: 3000