apiVersion: apps/v1
kind: Deployment
metadata:
  name: basic-web-deployment
  labels:
    app: basic-web
spec:
  replicas: 1
  # strategy:
  #   type: RollingUpdate
  #   rollingUpdate:
  #     maxSurge: 1       
  #     maxUnavailable: 0
  #   type: Recreate
  selector:
    matchLabels:
      app: basic-web
  template:
    metadata:
      labels:
        app: basic-web
    spec:
      containers:
      - name: basic-web
        image: jeffjojerjonescatulay/k8s-sandbox:basic-web.v11
        env:
          - name: API_URL
            valueFrom:
              configMapKeyRef:
                name: basic-web-configmap
                key: API_URL
        ports:
        - containerPort: 3000
