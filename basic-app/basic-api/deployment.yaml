apiVersion: apps/v1
kind: Deployment
metadata:
  name: basic-api-deployment
  labels:
    app: basic-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: basic-api
  template:
    metadata:
      labels:
        app: basic-api
    spec:
      containers:
      - name: basic-api
        image: jeffjojerjonescatulay/k8s-sandbox:basic-api.v11
        env:
          - name: SECRET_MESSAGE
            valueFrom:
              secretKeyRef:
                name: basic-api-secret
                key: SECRET_MESSAGE
        ports:
        - containerPort: 9090
        resources:
          requests:
            memory: "128Mi"  
            cpu: "100m"      
          limits:
            memory: "256Mi"  
            cpu: "500m"     
        readinessProbe:
          httpGet:
            path: /health   
            port: 9090
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 9090
          initialDelaySeconds: 15
          periodSeconds: 20
        volumeMounts:
        - name: data
          mountPath: /mnt/data/basic-api
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: basic-api-pvc
